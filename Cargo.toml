[workspace]
members = ["crates/roomlab-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "MIT"
authors = ["RoomLab contributors"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 1
