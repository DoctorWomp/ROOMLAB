[package]
name = "roomlab-core"
description = "RoomLab trusted control plane: event log, rooms, agents, scheduler, spawn governor, world authority, knowledge ACL, provider gateway."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "roomlab_core"
path = "src/lib.rs"

[[bin]]
name = "roomlab-schemas"
path = "src/bin/schemas.rs"

[[bin]]
name = "roomlab-bench"
path = "src/bin/bench.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-segmentation = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
futures-util = "0.3"
base64 = "0.22"
url = "2"

[dev-dependencies]
tempfile = "3"
